<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b13">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>VIRÉGO CLUB — Bientôt</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}body{min-height:100svh;display:grid;place-items:center;overflow:hidden;color:#f6eee4;background:radial-gradient(ellipse at 50% 105%,#47301c66,transparent 48%),radial-gradient(ellipse at 50% -15%,#25233c88,transparent 54%),#090b13}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.26;background-image:radial-gradient(#e8c59c 0.55px,transparent 0.55px);background-size:26px 26px;mask-image:linear-gradient(180deg,transparent,#000 45%,transparent)}main{text-align:center;padding:40px 22px;max-width:780px;position:relative}main:before{content:"";position:absolute;z-index:-1;inset:-110px -60px;background:radial-gradient(ellipse,#e5a55a0d,transparent 68%)}.symbol{height:1px;width:74px;background:linear-gradient(90deg,transparent,#d6ad79,transparent);margin:0 auto 44px}.brand{font-size:clamp(3rem,10vw,7.5rem);font-weight:350;letter-spacing:.14em;margin:0 0 0 .14em;line-height:1.05;background:linear-gradient(115deg,#fff2db 10%,#d9ae75 55%,#fff4dc 90%);background-clip:text;-webkit-background-clip:text;color:transparent}.club{font-size:clamp(.8rem,2vw,1.1rem);font-weight:500;letter-spacing:.8em;margin:20px 0 0 .8em;color:#e5c49d}.divider{width:1px;height:66px;background:linear-gradient(#cba476,transparent);margin:52px auto 26px}.message{font-family:Georgia,serif;font-style:italic;font-size:clamp(1.15rem,3vw,1.6rem);color:#ded5cb;margin:0 0 32px}.soon{font-size:.75rem;letter-spacing:.5em;font-weight:600;color:#c7a77e;margin-left:.5em}footer{position:fixed;bottom:25px;left:0;right:0;text-align:center;color:#867d79;font-size:.68rem;letter-spacing:.14em}@media(prefers-reduced-motion:no-preference){.symbol{animation:glow 5s ease-in-out infinite}@keyframes glow{50%{opacity:.35}}}
  </style>
</head>
<body>
  <main aria-label="VIRÉGO CLUB — bientôt">
    <div class="symbol" aria-hidden="true"></div>
    <h1 class="brand">VIRÉGO</h1>
    <p class="club">CLUB</p>
    <div class="divider" aria-hidden="true"></div>
    <p class="message">Quelque chose se prépare…</p>
    <p class="soon">BIENTÔT</p>
  </main>
  <footer>© VIRÉGO CLUB</footer>
</body>
</html>
